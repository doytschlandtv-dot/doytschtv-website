</style></head><body><div id="st"></div>
<script>
const MODE=new URLSearchParams(location.search).get("m");
const $=s=>document.querySelector(s);

const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eb=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const ST=$("#st");
const E=(h)=>{const d=document.createElement("div");d.innerHTML=h;ST.appendChild(d.firstElementChild);return ST.lastElementChild};
const END=(cta,sm)=>E(`<div id="end" class="abs"><div class="ring"><span>D</span></div><img src="../../logo.png" alt="DoytschlandTv"><p class="cl">Deutschland. Auf den Punkt.</p><p class="cta">${cta}</p><p class="sm">${sm}</p><p class="hd">@doytschlandtv · doytschtv.de</p></div>`);
const win=(t,a,b,c,d)=>Math.min(eo(seg(t,a,b)),1-seg(t,c,d));
const rise=(el,t,a,b,dy=40)=>{el.style.transform=`translateY(${(1-eo(seg(t,a,b)))*dy}px)`};

const T_END=20.4;
if(MODE==="e1"){

 const f1=E(`<div class="abs h1" style="left:70px;right:70px;top:300px;opacity:0;font-size:96px">Das Geld wird nicht angespart.<br><span style="color:#b2231c">Es zahlt die Renten von heute.</span></div>`);
 const f2=E(`<div class="big2" style="top:830px;opacity:0">Heute zahlen sie ein. Heute bekommen <b style="color:#b2231c">rund 21,5 Mio.</b> Rentnerinnen und Rentner ihre Rente.</div>`);
 const f3=E(`<div class="big2" style="top:1250px;opacity:0;background:#0a0a0a;color:#f8f7f2">Deine Rente zahlt später die nächste Generation.</div>`);

  f2.style.opacity=win(t,9.2,9.7,16.3,16.8);rise(f2,t,9.2,9.7);

if(MODE==="e2"){

 const msgs=[["me",.3,"Erststimme, Zweitstimme … was war nochmal was?"],["us",3.2,"Erststimme: eine Person aus deinem Wahlkreis."],["us",4.7,"Zweitstimme: die Landesliste einer Partei."],["rd",6.2,"Seit der Reform 2023 entscheidet allein die Zweitstimme über die Sitze."],["me",9.2,"Und wie viele Abgeordnete gibt es?"],["us",12.0,"Höchstens 630. Der Bundestag kann nicht mehr anwachsen."],["me",14.6,"Wo erklärt ihr noch mehr davon?"],["us",17.3,"11 Erklärstücke, 3 bis 4 Minuten, jede Zahl mit Quelle."]];

 const dots=document.createElement("div");dots.className="bub us";dots.innerHTML="<span style='letter-spacing:10px;font-weight:800'>•••</span>";dots.style.opacity=0;col.appendChild(dots);

 };

if(MODE==="d1"){
 const k=E(`<div class="abs kick" style="left:70px;top:210px;opacity:0">Dossiers · so sortieren wir</div>`);
 const h=E(`<div class="abs h1" style="left:70px;right:70px;top:300px;opacity:0">Nicht alles, was du liest, ist <span style="color:#b2231c">gleich sicher.</span></div>`);
 const tr=[["Belegt","#0a0a0a","#f8f7f2"],["Nur berichtet","#e4e1d6","#0a0a0a"],["Offen","#f8f7f2","#b2231c"]].map((x,i)=>E(`<div class="tray" style="left:${70+i*325}px;background:${x[1]};color:${x[2]};border:6px solid ${i==2?"#b2231c":x[1]};opacity:0"><h4>${x[0]}</h4><i>0</i></div>`));
 const it=[["„Wörtlich zitiert, mit Datum, Ort und Quelle.“",0],["Ein Bericht, den noch kein Gericht bestätigt hat.",1],["Eine Frage, auf die es noch keine belastbare Antwort gibt.",2]].map(x=>E(`<div class="big2" style="top:620px;opacity:0;transform-origin:50% 50%">${x[0]}</div>`));

  h.style.opacity=win(t,.4,1.0,3.0,3.4);rise(h,t,.4,1.0);
  tr.forEach((e,i)=>{e.style.opacity=win(t,2.6+i*.2,3.0+i*.2,T_END,T_END+.4);rise(e,t,2.6+i*.2,3.0+i*.2,80);});

   const tx=70+i*325+155, cx=540;
   e.style.opacity=t<a?0:(1-seg(t,a+2.7,a+2.9));
   const x=(tx-cx)*mv, y=(1380-800)*mv;

   if(t>a+2.7)cnt[i]=1;});
  tr.forEach((e,i)=>e.querySelector("i").textContent=cnt[i]);
  l1.style.opacity=win(t,12.4,12.9,T_END,T_END+.4);rise(l1,t,12.4,12.9);
  l2.style.opacity=win(t,14.6,15.1,T_END,T_END+.4);rise(l2,t,14.6,15.1);
  end.style.opacity=eo(seg(t,T_END+.3,T_END+.9));
 };
}
if(MODE==="d2"){
 const k=E(`<div class="abs kick" style="left:70px;top:210px;opacity:0">Dossiers · die ganze Akte</div>`);
 const h=E(`<div class="abs h1" style="left:70px;right:70px;top:300px;opacity:0">Die Schlagzeile<br>ist nicht <span style="color:#b2231c">die ganze Akte.</span></div>`);
 const names=["Worum es geht","Was Gesetze und Gerichte sagen","Reaktionen und Maßnahmen","Einwände und Gegenseite","Was offen oder nur schwach belegt ist"];
 const tabs=names.map((n,i)=>E(`<div class="tab" style="top:${560+i*170}px;opacity:0;${i>=3?"border-color:#b2231c;":""}"><u>${i+1}</u><span>${n}</span></div>`));
 const src=E(`<div class="abs" style="left:70px;right:70px;top:1470px;opacity:0"><div class="num" id="qn" style="font-size:200px">0</div><div class="lab" style="margin-top:6px">Quellen in der ersten Dossier-Folge</div></div>`);

  hl.style.opacity=win(t,11.6,12.1,15.0,15.4);rise(hl,t,11.6,12.1);
  hs.style.opacity=win(t,16.0,16.5,T_END,T_END+.4);rise(hs,t,16.0,16.5);
  end.style.opacity=eo(seg(t,T_END+.3,T_END+.9));
 };

if(MODE==="m1"){
